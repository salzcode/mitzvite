<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    :root { --ink: #1f2a44; --accent: #b08d3c; --bg: #f7f2e8; --tint: #fbf8f1; --display: Georgia, serif; --title: Georgia, serif; --tweight: 400; --body: Georgia, serif; --dsize: 1; }
    body { margin: 0; background: var(--bg); color: #333; font: 17px/1.6 var(--body); }
    .wrap { max-width: 580px; margin: 0 auto; padding: 28px 16px 56px; }
    .layout { display: grid; gap: 18px; }
    .card { --padx: 22px; --pady: 32px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: var(--pady) var(--padx);
            box-shadow: 0 10px 40px rgba(0,0,0,.06); }
    .hero { display: block; width: calc(100% + 2 * var(--padx)); margin: calc(-1 * var(--pady)) calc(-1 * var(--padx)) 24px; border-radius: 14px 14px 0 0; }
    /* The invitation itself: a framed card, like the printed one. */
    .invitation { position: relative; text-align: center; background: var(--tint); }
    .invitation.framed:after { content: ''; position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 8px; pointer-events: none; }
    .invitation .reply-by { font-size: 14px; font-style: italic; color: #777; margin-top: 18px; }
    @media (min-width: 900px) {
      .wrap { max-width: 1160px; padding: 48px 32px 72px; }
      .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; align-items: start; }
      .invitation { position: sticky; top: 24px; --padx: 44px; --pady: 48px; }
      .invitation h1 { font-size: calc(56px * var(--dsize)); }
      .invitation .invite-words { font-size: 18px; }
      #app { --padx: 36px; --pady: 40px; }
    }
    .kicker { text-align: center; letter-spacing: 4px; color: var(--accent); font-size: 12px; text-transform: uppercase; }
    h1 { text-align: center; font-family: var(--display); font-weight: normal; color: var(--ink); font-size: calc(42px * var(--dsize)); line-height: 1.15; margin: 8px 0 6px; }
    .rule { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--accent); font-size: 10px; margin: 6px 0 22px; }
    .rule:before, .rule:after { content: ''; width: 48px; border-top: 1px solid var(--accent); }
    .lead { text-align: center; margin: 0 0 8px; }
    .muted { color: #777; font-size: 14px; text-align: center; }
    .banner { background: #fff4d6; border: 1px solid #e8c873; border-radius: 6px; padding: 10px 12px; font: 14px Arial, sans-serif; margin-bottom: 14px; }
    .event { display: flex; gap: 14px; border: 2px solid var(--line); background: var(--tint); border-radius: 10px; padding: 14px; margin-top: 14px; cursor: pointer;
             transition: border-color .15s, background .15s; }
    .event.on { border-color: #2e7d32; background: #f3faf3; }
    .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font: bold 15px Arial, sans-serif;
           display: flex; align-items: center; justify-content: center; margin-top: 2px; }
    .body { flex: 1; min-width: 0; }
    .event h2 { margin: 0; font-family: var(--title); font-weight: var(--tweight); font-size: calc(22px * min(var(--dsize), 1.2)); line-height: 1.25; color: var(--ink); }
    .event .info { color: #555; font-size: 14px; }
    .tick { display: flex; align-items: center; gap: 10px; margin-top: 10px; font: 15px var(--body); user-select: none; }
    .box { flex: none; width: 26px; height: 26px; border: 2px solid #b8ab8f; border-radius: 6px; background: #fff;
           display: flex; align-items: center; justify-content: center; color: #fff; font: bold 18px Arial, sans-serif; }
    .event.on .box { background: #2e7d32; border-color: #2e7d32; }
    .count { display: none; align-items: center; gap: 10px; font: 15px var(--body); margin-top: 10px; cursor: default; }
    .event.on .count { display: flex; }
    .step { width: 38px; height: 38px; border: 1px solid #c9bea6; border-radius: 8px; background: #fff; font: bold 20px Arial, sans-serif;
            color: var(--ink); cursor: pointer; }
    .step:disabled { opacity: .35; cursor: default; }
    .count b { min-width: 24px; text-align: center; font-size: 20px; color: var(--ink); }
    textarea { font: 16px var(--body); border: 1px solid #ccc; border-radius: 6px; padding: 8px; width: 100%; min-height: 80px; margin-top: 6px; }
    .note { padding-top: 18px; margin-top: 22px; border-top: 1px solid var(--line); font: 15px var(--body); }
    button.send { width: 100%; margin-top: 20px; padding: 14px; font: 17px var(--body); letter-spacing: 1px; color: #fff; background: var(--ink);
             border: 0; border-radius: 999px; cursor: pointer; }
    button.send:disabled { opacity: .6; cursor: default; }
    .err { color: #9e3b3b; font: 14px Arial, sans-serif; margin-top: 12px; text-align: center; min-height: 1em; }
    .done { text-align: center; }
    .done .big { font-family: var(--display); font-size: calc(26px * min(var(--dsize), 1.2)); color: var(--ink); margin: 8px 0; }
    .summary { text-align: left; font: 15px var(--body); margin: 16px auto; max-width: 360px; }
    .summary div { padding: 6px 0; border-bottom: 1px solid #f0e8d8; }
    .link { background: none; border: 0; color: var(--ink); text-decoration: underline; font: 15px var(--body); cursor: pointer; padding: 4px; }
    .invite-words { text-align: center; font-style: italic; color: #555; font-size: 16px; line-height: 1.6; margin: 0 0 4px; }
    .section { text-align: center; letter-spacing: 4px; color: var(--accent); font-size: 12px; text-transform: uppercase; margin: 30px 0 4px; }
    .section + .muted { margin-top: 2px; }

    /* Opening envelope */
    #intro { position: fixed; inset: 0; z-index: 10; background: radial-gradient(ellipse at 50% 45%, var(--env-bg2, #2c3a5c), var(--ink) 75%); display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 28px; transition: opacity .7s ease .9s; cursor: pointer; }
    #intro[hidden] { display: none; }
    #intro.gone { opacity: 0; pointer-events: none; }
    .env { position: relative; width: min(86vw, 420px); aspect-ratio: 10 / 7; perspective: 900px; margin-top: 12vh;
           filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
    .env > div:not(.seal) { position: absolute; inset: 0; border-radius: 6px; }
    .env-back { background: var(--env-back, #d8c49a); }
    .env-card { inset: 3% 8% auto 8% !important; height: auto; aspect-ratio: 4 / 3; background: #fff center / cover no-repeat; box-shadow: 0 6px 18px rgba(0,0,0,.15);
                display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px;
                font-family: var(--display); color: var(--ink); font-size: calc(26px * min(var(--dsize), 1.3));
                transition: transform 1s cubic-bezier(.3,.7,.3,1) .45s; }
    .env-front { background: var(--env-front, #fbf6ea); clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
                 display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4%;
                 font-family: var(--display); color: var(--ink); font-size: calc(30px * min(var(--dsize), 1.3)); filter: drop-shadow(0 -1px 0 var(--env-line, #d8c49a)); }
    .env-flap { background: var(--env-flap, #f1e7d0); clip-path: polygon(0 0, 100% 0, 50% 58%); transform-origin: top;
                transition: transform .6s ease, z-index 0s .3s; z-index: 3; }
    .seal { position: absolute; left: 50%; top: 58%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; z-index: 4;
            background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font: 22px var(--display);
            box-shadow: inset 0 0 0 4px rgba(255,255,255,.25); transition: opacity .25s; }
    .tap { font: 14px var(--body); letter-spacing: 3px; text-transform: uppercase; color: var(--env-tap, #e9d9b0); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    #intro.open .seal { opacity: 0; }
    #intro.open .env-flap { transform: rotateX(180deg); z-index: 0; }
    #intro.open .env-card { transform: translateY(-62%); }
    #intro.open .tap { visibility: hidden; }
  </style>
</head>
<body>
<div id="intro" hidden><div class="env"><div class="env-back"></div><div class="env-flap"></div><div class="env-card" id="envCardEl"></div>
  <div class="env-front" id="envText"></div><div class="seal" id="seal"></div></div><div class="tap">Tap to open</div></div>
<div class="wrap"><div class="layout"><aside class="card invitation" id="invitation"></aside><main class="card" id="app"></main></div></div>

<script>
  var M = <?!= modelJson ?>;
  var app = document.getElementById('app');
  (function applyStyle(st) {
    if (!st) return;
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = st.fontsUrl; document.head.appendChild(l);
    var r = document.documentElement.style;
    r.setProperty('--ink', st.ink); r.setProperty('--accent', st.accent); r.setProperty('--bg', st.bg); r.setProperty('--tint', st.tint);
    // Envelope colours: cream paper on a dark backdrop in the theme's ink colour.
    function mix(a, b, t) {
      var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16), out = '#';
      for (var sh = 16; sh >= 0; sh -= 8) {
        var v = Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
        out += (v < 16 ? '0' : '') + v.toString(16);
      }
      return out;
    }
    r.setProperty('--line', mix('#ffffff', st.accent, 0.35));
    r.setProperty('--env-bg2', mix(st.ink, '#ffffff', 0.12));
    r.setProperty('--env-front', mix('#fffdf7', st.accent, 0.06));
    r.setProperty('--env-flap', mix('#fffdf7', st.accent, 0.16));
    r.setProperty('--env-back', mix('#fffdf7', st.accent, 0.45));
    r.setProperty('--env-line', mix('#fffdf7', st.accent, 0.35));
    r.setProperty('--env-tap', mix(st.accent, '#ffffff', 0.45));
    r.setProperty('--display', st.display); r.setProperty('--title', st.title); r.setProperty('--tweight', st.titleWeight); r.setProperty('--body', st.body); r.setProperty('--dsize', st.displaySize);
  })(M.style);
  var state = {}; // eventId -> {on: bool, count: n}

  function esc(t) {
    return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function header() {
    var words = M.found && M.websiteMessage;
    return (M.image ? '<img class="hero" alt="" src="' + M.image + '">' : '') +
      (words ? '<p class="invite-words">' + esc(M.websiteMessage).replace(/\n/g, '<br>') + '</p>'
        : M.heading ? '<div class="kicker">' + esc(M.heading) + '</div>' : '') +
      '<h1>' + esc(M.child) + '</h1><div class="rule">◆</div>' +
      (M.found && M.deadline ? '<div class="reply-by">Kindly reply by ' + esc(M.deadline) + '</div>' : '');
  }
  (function () {
    var inv = document.getElementById('invitation');
    inv.innerHTML = header();
    if (!M.image) inv.className += ' framed';
  })();

  /** The envelope that opens when the page loads (tap, or it opens by itself after a moment). */
  function intro() {
    var el = document.getElementById('intro');
    if (!M.found) return;
    el.hidden = false;
    document.getElementById('envText').textContent = M.envelopeText || '';
    document.getElementById('seal').textContent = (M.child || '').charAt(0);
    var card = document.getElementById('envCardEl');
    if (M.image) card.style.backgroundImage = 'url(' + M.image + ')'; else card.textContent = M.child;
    var opened = false;
    function open() {
      if (opened) return; opened = true;
      el.className = 'open';
      setTimeout(function () { el.className = 'open gone'; }, 900);
      setTimeout(function () { el.hidden = true; }, 2600);
    }
    el.addEventListener('click', open);
    setTimeout(open, 2200);
  }

  function renderForm() {
    if (!M.found) {
      app.innerHTML = '<p class="lead">We couldn\'t find your invitation.</p>' +
        '<p class="muted">Please open the RSVP button from your invitation email again, or contact ' + esc(M.hosts) + '.</p>';
      return;
    }
    var h = '';
    if (M.preview) h += '<div class="banner"><b>Preview</b> — this is what ' + esc(M.family) + ' will see. Answers here are not saved.</div>';
    h += '<p class="lead">' + esc(M.greeting) + ',</p>';
    h += '<div class="section">The celebrations</div>';
    h += '<p class="muted">' + (M.replied ? 'You already replied — you can change your answers below.' :
         'Tick each one you\'ll join and tell us how many of you are coming' + (M.deadline ? '. Kindly reply by ' + esc(M.deadline) : '') + '.') + '</p>';

    M.events.forEach(function (ev, i) {
      var a = M.answers[ev.id];
      state[ev.id] = { on: !!(a && a.attending), count: a && a.attending ? a.count : Math.min(M.max, 2) || 1 };
      h += '<div class="event" id="e' + i + '" role="checkbox" tabindex="0"><div class="num">' + (i + 1) + '</div><div class="body">' +
        '<h2>' + esc(ev.name) + '</h2><div class="info">' + [ev.when, ev.where, ev.details].filter(Boolean).map(esc).join('<br>') + '</div>' +
        '<div class="tick"><span class="box">✓</span><span>We\'ll be there</span></div>' +
        '<div class="count">How many? <button type="button" class="step" data-d="-1">−</button><b id="n' + i + '"></b>' +
        '<button type="button" class="step" data-d="1">+</button></div></div></div>';
    });
    h += '<div class="note">A note for the family (optional)<textarea id="msg" maxlength="2000"></textarea></div>' +
      '<button class="send" id="send">' + (M.replied ? 'Update my RSVP' : 'Send my RSVP') + '</button><div class="err" id="err"></div>';
    app.innerHTML = h;
    document.getElementById('msg').value = M.message || '';

    M.events.forEach(function (ev, i) {
      var el = document.getElementById('e' + i);
      var toggle = function () { state[ev.id].on = !state[ev.id].on; paint(i); };
      el.addEventListener('click', function (e) { if (!e.target.closest('.count')) toggle(); });
      el.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
      el.querySelectorAll('.step').forEach(function (b) {
        b.addEventListener('click', function () {
          var s = state[ev.id];
          s.count = Math.max(1, Math.min(M.max, s.count + parseInt(b.getAttribute('data-d'), 10)));
          paint(i);
        });
      });
      paint(i);
    });
    document.getElementById('send').addEventListener('click', submit);
  }

  function paint(i) {
    var ev = M.events[i], s = state[ev.id], el = document.getElementById('e' + i);
    el.className = 'event' + (s.on ? ' on' : '');
    el.setAttribute('aria-checked', s.on ? 'true' : 'false');
    document.getElementById('n' + i).textContent = s.count;
    var steps = el.querySelectorAll('.step');
    steps[0].disabled = s.count <= 1;
    steps[1].disabled = s.count >= M.max;
  }

  function submit() {
    var err = document.getElementById('err');
    var answers = {};
    M.events.forEach(function (ev) {
      var s = state[ev.id];
      answers[ev.id] = { attending: s.on, count: s.on ? s.count : 0 };
    });
    var msg = document.getElementById('msg').value;
    var any = M.events.some(function (ev) { return state[ev.id].on; });
    if (!any && !confirm('You haven\'t ticked any events, so we\'ll note that you can\'t make it. Send?')) return;
    if (M.preview) { M.answers = answers; M.message = msg; renderDone(true); return; }
    var btn = document.getElementById('send');
    btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
    google.script.run
      .withSuccessHandler(function () { M.answers = answers; M.message = msg; M.replied = true; renderDone(false); })
      .withFailureHandler(function (e) {
        btn.disabled = false; btn.textContent = 'Try again';
        err.textContent = (e && e.message) || 'Something went wrong — please try again.';
      })
      .submitRsvp(M.token, answers, msg);
  }

  function renderDone(preview) {
    var any = M.events.some(function (ev) { return M.answers[ev.id] && M.answers[ev.id].attending; });
    var h = '<div class="done">';
    if (preview) h += '<div class="banner">Preview — nothing was saved.</div>';
    h += '<div class="big">' + (any ? 'Thank you — we can\'t wait to celebrate with you!' : 'Thank you for letting us know. You\'ll be missed!') + '</div>';
    h += '<div class="summary">' + M.events.map(function (ev, i) {
      var a = M.answers[ev.id] || {};
      return '<div><b>' + (i + 1) + '. ' + esc(ev.name) + '</b><br>' + (a.attending ? 'Yes — ' + a.count + (a.count === 1 ? ' guest' : ' guests') : 'Not attending') + '</div>';
    }).join('') + '</div>';
    h += '<p class="muted">You can come back to this page with the same link to change your answers.</p>' +
      '<button class="link" id="again">Change my answers</button></div>';
    app.innerHTML = h;
    document.getElementById('again').addEventListener('click', renderForm);
  }

  try { intro(); } catch (e) { document.getElementById('intro').hidden = true; }
  renderForm();
</script>
</body>
</html>
